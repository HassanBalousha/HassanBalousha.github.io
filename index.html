<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hassan Balousha — Developer</title>
  <meta name="description" content="Official developer website for Hassan Balousha." />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --card: #171a21;
      --text: #f5f7fa;
      --muted: #aab2bf;
      --border: #2a2f3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    main {
      width: min(680px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px;
    }
    h1 { margin: 0 0 10px; font-size: 32px; }
    p { color: var(--muted); line-height: 1.7; margin: 8px 0; }
    a { color: inherit; }
    .note {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hassan Balousha</h1>
    <p>Software Developer &amp; Mobile App Developer.</p>
    <p>Official developer website for published applications.</p>

    <div class="note">
      <p>
        Authorized advertising sellers information:
        <a href="/app-ads.txt">app-ads.txt</a>
      </p>
    </div>
  </main>
</body>
</html>
